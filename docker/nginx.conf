worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /var/log/nginx/access.log;

  # Every temp path has to sit somewhere the nginx user can write. /tmp is a
  # tmpfs in the compose file, so nginx creates these directories on start.
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles are immutable; the HTML entry point never is.
    location /static/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location = /index.html {
      add_header Cache-Control "no-store";
    }

    # Client-side routing: /login and /sign-up are not files on disk.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
